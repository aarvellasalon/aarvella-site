<button
  id="ai-chat-button"
  type="button"
  aria-label="Open AI Stylist"
  aria-controls="ai-chat-widget"
  aria-expanded="false"
>
  <svg
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <path
      d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
    />
  </svg>

  <span>AI Stylist</span>
</button>

<div
  id="ai-chat-widget"
  role="dialog"
  aria-modal="false"
  aria-labelledby="ai-chat-title"
  hidden
>
  <div class="ai-chat-header">
    <div>
      <strong id="ai-chat-title">Aarvella AI Stylist</strong>
      <span>Find the right service</span>
    </div>

    <button
      id="ai-chat-close"
      type="button"
      aria-label="Close AI Stylist"
    >
      ×
    </button>
  </div>

  <div
    id="ai-chat-messages"
    aria-live="polite"
    aria-relevant="additions"
  >
    <div class="ai-message bot">
      Hi, I’m Aarvella’s AI Stylist. Are you looking for hair,
      skin, makeup, or bridal services?
    </div>
  </div>

  <form id="ai-chat-form">
    <label for="ai-chat-input" class="ai-chat-visually-hidden">
      Type your message
    </label>

    <input
      id="ai-chat-input"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
      enterkeyhint="send"
      maxlength="500"
    />

    <button type="submit">
      Send
    </button>
  </form>
</div>
